[package]
name = "sv2-p2pool-testenv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Regtest test harness for sv2-p2pool — bitcoind + (future) p2poolv2 + (future) sv2-p2pool spawners"

[lib]
name = "sv2_p2pool_testenv"
path = "src/lib.rs"

[dependencies]
# corepc-node spawns bitcoind regtest via auto-downloaded binary or
# BITCOIND_EXE env override. This is the foundation primitive per the
# research synthesis at
# ~/wiki/topics/sv2-p2pool-integration/wiki/topics/regtest-harness-design.md.
corepc-node = { version = "0.6", features = ["28_0"] }

# Bitcoin types — pinned to the same version sv2-p2pool-engine pulls in
# (0.32.x).
bitcoin = "0.32"

anyhow  = { workspace = true }
tokio   = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Tempdir for spawner datadirs (Phase 2.6: p2poolv2_node spawner).
tempfile = "3"

[dev-dependencies]
# Phase 2-B Track A (ADR 0011): integration tests under `tests/` boot a
# real capnp IPC daemon (via `p2poolv2_ipc::spawn_ipc_server_full`) and
# drive `sv2_p2pool::share_chain::IpcChain` against it, exercising the
# chain-read seam end-to-end. AGPL exposure is fine for dev-deps — the
# testenv lib + binaries do not link these.
p2poolv2_ipc      = { path = "../../vendor/p2poolv2/p2poolv2_ipc" }
sv2-p2pool-pool   = { path = "../sv2-p2pool-pool" }
sv2-p2pool-engine = { path = "../sv2-p2pool-engine" }
tokio             = { workspace = true, features = ["full", "test-util"] }

# wiremock backs the SCMJ-rejection E2E
# (`tests/e2e_scmj_rejects_consensus_invalid_template.rs`): we host an
# HTTP server that intercepts bitcoind JSON-RPC calls and returns a
# canned `getblocktemplate` proposal-mode rejection so the engine's
# validate_block_proposal hop fires `consensus_rejected`.
wiremock = "0.6"
serde_json = "1"

# `IpcChain::connect` (in `e2e_ipc_chain.rs`) takes an
# `IpcChainMetrics` now — build a fresh one via
# `Registry::new()` for each test.
prometheus = "0.13"
