[package]
name = "sv2-p2pool-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Cap'n Proto client for talking to a p2poolv2 IPC daemon (Phase 2)"

[dependencies]
capnp     = "0.25"
capnp-rpc = "0.25"
# Schema crate. Dual-licensed MIT OR Apache-2.0 so this AGPL-free client
# can depend on it without inheriting the daemon's license; see ADR 0010.
p2poolv2-capnp-types = { path = "../../vendor/p2poolv2/p2poolv2-capnp-types" }
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
thiserror = { workspace = true }
tracing = { workspace = true }
# Surface `bitcoin::BlockHash` and `bitcoin::Network` in the public
# client API. bitcoin-rs is MIT/Apache, so this does not affect the
# AGPL boundary; the client stays consumable by non-AGPL callers.
bitcoin = "0.32"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
# Server-side stub for round-trip integration tests. AGPL is OK in
# dev-deps because the test binary isn't shipped.
p2poolv2_ipc = { path = "../../vendor/p2poolv2/p2poolv2_ipc" }
