[package]
name = "sv2-p2pool-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "SV2 mining pool binary using p2poolv2 as share-chain backend"

[[bin]]
name = "sv2-p2pool"
path = "src/main.rs"

[dependencies]
sv2-p2pool-engine = { path = "../sv2-p2pool-engine" }

# Bitcoin types — pinned to the same version sv2-p2pool-engine pulls in
# (0.32.x) so the Network enum is the same type across the boundary.
bitcoin            = "0.32"

tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
serde              = { workspace = true }
toml               = { workspace = true }
